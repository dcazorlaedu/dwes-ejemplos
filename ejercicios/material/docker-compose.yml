services:
  web:
    build: ./docker/php
    ports: ["8080:80"]
    environment:
      DB_HOST: db
      DB_NAME: tienda
      DB_USER: dwes
      DB_PASS: dwes_dev
    volumes:
      - ./src:/var/www/html
    depends_on: [db]
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_dev
      MYSQL_DATABASE: tienda
      MYSQL_USER: dwes
      MYSQL_PASSWORD: dwes_dev
    ports: ["3306:3306"]            # DataGrip se conecta a localhost:3306
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d
volumes:
  db_data:
